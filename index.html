
<!DOCTYPE html>
<html lang="es">
<head>

    <title>Sistema de Análisis de Rentabilidad de Proyectos (S.A.R.P.)</title>

    <meta property="og:title" content="Sistema de Análisis de Rentabilidad de Proyectos (S.A.R.P.)" />
    <meta property="og:description" content="A robust web application for analyzing the profitability of projects by processing data from Excel files and manual entries. It includes modules for administration, data loading, and reporting." />
    <script src="https://cdn.tailwindcss.com"></script>

        color: oklch(20% 0.012 40);
